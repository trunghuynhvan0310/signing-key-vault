name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Khóa debug cố định giữa các lần build để có thể cài đè bản mới lên bản cũ
      # khi chưa có khóa riêng.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1

      - name: Read version
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Prepare signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
          else
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "::warning::Thiếu secret ký (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD): build bằng khóa debug."
          fi

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --console=plain testDebugUnitTest 2>&1 | tee build.log

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle --console=plain assembleRelease 2>&1 | tee -a build.log
          else
            gradle --console=plain assembleDebug 2>&1 | tee -a build.log
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/"$BUILD_TYPE"/*.apk | head -n1)
          if [ "$BUILD_TYPE" = "release" ]; then
            NAME="signing-key-vault-v${VERSION_NAME}.apk"
          else
            NAME="signing-key-vault-v${VERSION_NAME}-debug.apk"
          fi
          cp "$SRC" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/*

      - name: Publish release
        run: |
          TAG="v${VERSION_NAME}"
          if [ "$BUILD_TYPE" = "release" ]; then PRE=""; else PRE="--prerelease"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Signing Key Vault $TAG" \
              --notes "APK: $APK_NAME (loại build: $BUILD_TYPE). Xem CHANGELOG.md." $PRE
          fi

      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "### Build lỗi"
            echo '```'
            grep -E '^e: |error:|FAILED|What went wrong' -A2 build.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
